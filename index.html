<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra ADHD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Gra ADHD</h1>
        <nav>
            <a href="#" onclick="changeLocation('Centrum miasta')">Centrum miasta</a>
            <a href="#" onclick="changeLocation('Wieś')">Wieś</a>
            <a href="#" onclick="changeLocation('Port')">Port</a>
        </nav>
        <div id="stats">
            Energia: <span id="energy"></span> |
            Nastrój: <span id="mood"></span> |
            Fokus: <span id="focus"></span>
        </div>
        <div id="time"></div>
        <button onclick="saveGame()">Zapisz grę</button>
        <button onclick="loadGame()">Wczytaj grę</button>
    </header>
    <div id="content">Witaj w grze!</div>
    <button onclick="startDialogue('neighbor')">Porozmawiaj z sąsiadem</button>
    <div id="npcDialogue"></div>
    <div id="notification" style="display:none;"></div>
    <script src="script.js"></script>
</body>
</html>
