<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra ADHD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Gra ADHD</h1>
        <nav>
            <a href="#" onclick="changeLocation('Centrum miasta')">Centrum miasta</a>
            <a href="#" onclick="changeLocation('Wieś')">Wieś</a>
            <a href="#" onclick="changeLocation('Port')">Port</a>
            <a href="#" onclick="changeLocation('Biblioteka')">Biblioteka</a>
        </nav>
        <div id="stats">
            Energia: <span id="energy"></span> |
            Nastrój: <span id="mood"></span> |
            Fokus: <span id="focus"></span>
        </div>
        <div id="time"></div>
        <button onclick="saveGame()">Zapisz grę</button>
        <button onclick="loadGame()">Wczytaj grę</button>
    </header>
    <div id="content">Witaj w grze!</div>
    <button onclick="startDialogue('neighbor')">Porozmawiaj z sąsiadem</button>
    <div id="npcDialogue"></div>
    <!-- Przycisk uruchamiający minigrę memory -->
    <button id="memoryBtn" onclick="startMemoryGame()" style="display:none;">Zagraj w memory</button>
    <!-- Kontener minigry memory -->
    <div id="memoryGame" style="display:none;">
        <div id="cardsContainer">
            <button class="card" data-index="0">?</button>
            <button class="card" data-index="1">?</button>
            <button class="card" data-index="2">?</button>
            <button class="card" data-index="3">?</button>
        </div>
        <p id="gameMessage"></p>
        <button id="memoryAgain" style="display:none;" onclick="startMemoryGame()">Zagraj ponownie</button>
    </div>
    <!-- Sekcja z zadaniem wieloetapowym -->
    <div id="quest">
        <h2 id="questTitle"></h2>
        <ul id="questStages"></ul>
        <progress id="questProgress" value="0" max="0"></progress>
        <div id="questStatus"></div>
        <button id="stageBtn" onclick="doCurrentStage()">Wykonaj bieżący etap</button>
    </div>
    <div id="notification" style="display:none;"></div>
    <script src="script.js"></script>
</body>
</html>
